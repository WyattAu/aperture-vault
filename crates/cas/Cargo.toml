[package]
name = "aperture-cas"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Content-addressed blob store for the Aperture photo and video vault — BLAKE3 addressing, atomic ingest, deduplication by construction"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/aperture-vault"
keywords = ["content-addressed", "storage", "blake3", "dedup", "vault"]
categories = ["filesystem", "database-implementations"]
exclude = [".github/"]

[dependencies]
# Sole content dependency: the address *is* the hash. BLAKE3 is the fastest
# widely-audited cryptographic hash with SIMD on x86_64 and ARM, and it is
# what makes deduplication a property of addressing rather than a feature.
blake3 = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[package.metadata.layers]
tier = "L0"
