[package]
name = "aperture-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "The Aperture ingest pipeline — CAS write, metadata probe, index record, composed and dedup-aware"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/aperture-vault"
keywords = ["ingest", "pipeline", "content-addressed"]
categories = ["multimedia"]

[dependencies]
aperture-cas = { version = "0.1", path = "../cas" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
thumbhash = "0.1"
sha1 = "0.10"
dsp-spectral = { version = "0.1", path = "../../../dsp-spectral" }
aperture-probe = { version = "0.1", path = "../probe" }
aperture-index = { version = "0.1", path = "../index" }
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
thumbhash = "0.1"
sha1 = "0.10"
dsp-spectral = { version = "0.1", path = "../../../dsp-spectral" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[package.metadata.layers]
tier = "L1"
