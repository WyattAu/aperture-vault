# Bespoke CI: this workspace's crates reference estate siblings by relative
# path (crates/probe -> ../../../mp4-core), so the shared rust-kit reusable
# workflow — which checks out one repository — cannot resolve them. This
# workflow checks out the sibling one level above the repository, the same
# shape a local clone has, then runs the same gates.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: checkout the mp4-core sibling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WyattAu/mp4-core
          ref: main
          path: mp4-core-sibling
          persist-credentials: false
          # mp4-core is private; the job token cannot see it. ESTATE_TOKEN (a
          # PAT with read access to the estate) turns this green. Until the
          # secret exists, this step fails — honestly, rather than the whole
          # gate passing while silently skipping the sibling.
          token: ${{ secrets.ESTATE_TOKEN || github.token }}

      - name: checkout the dsp-spectral sibling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WyattAu/dsp-spectral
          ref: main
          path: dsp-spectral-sibling
          persist-credentials: false
          token: ${{ secrets.ESTATE_TOKEN || github.token }}

      - name: place the siblings where the path dependencies resolve
        run: |
          # crates/probe -> ../../../mp4-core and crates/pipeline ->
          # ../../../dsp-spectral resolve one level above this repository;
          # actions/checkout cannot write there, so the checked-out
          # siblings are symlinked into place.
          ln -s "$GITHUB_WORKSPACE/mp4-core-sibling" "$(dirname "$GITHUB_WORKSPACE")/mp4-core"
          ln -s "$GITHUB_WORKSPACE/dsp-spectral-sibling" "$(dirname "$GITHUB_WORKSPACE")/dsp-spectral"
          ls -la "$(dirname "$GITHUB_WORKSPACE")"

      - name: install the toolchain
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
            --location --silent --show-error --fail https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

      - name: feature gates
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
            --location --silent --show-error --fail \
            https://raw.githubusercontent.com/WyattAu/engineering-standards/main/scripts/check-features.py \
            -o check-features.py
          python3 check-features.py --cwd .
